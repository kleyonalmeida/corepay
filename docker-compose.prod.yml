services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: corepay-prod-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      MSSQL_PID: "Express"
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_prod_data:/var/opt/mssql
      - /opt/corepay/backups:/var/opt/mssql/backup
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - corepay-prod-net

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: corepay-pro-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?ConnectionStrings__DefaultConnection is required}
      Jwt__Key: ${Jwt__Key:?Jwt__Key is required}
      Facilities__WebhookSecret: ${Facilities__WebhookSecret:?Facilities__WebhookSecret is required}
      Seed__SuperAdmin__Email: ${Seed__SuperAdmin__Email:?Seed__SuperAdmin__Email is required}
      Seed__SuperAdmin__Password: ${Seed__SuperAdmin__Password:?Seed__SuperAdmin__Password is required}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:?Cors__AllowedOrigins is required}
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - corepay-prod-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
    container_name: corepay-pro-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - corepay-prod-net

volumes:
  sqlserver_prod_data:

networks:
  corepay-prod-net:
    driver: bridge
